<!-- ══════════════════════════════════════════════════════════════════════
     MyGuide progress dashboard — Webflow Code Embed
     ─────────────────────────────────────────────────────────────────────
     URLs are already set for FrederikOngenae/BNPPF-Dashboard via GitHub
     Pages. Paste this whole block into a Webflow "Code embed" element —
     nothing to replace.

     Prerequisite: GitHub Pages must be switched on for the repo
     (Settings → Pages → Deploy from a branch → main → / (root)).
     Confirm this loads in a normal browser tab first:
     https://frederikongenae.github.io/BNPPF-Dashboard/MyGuide-webflow/MyGuide-dashboard.html

     Do NOT wrap this in <html>, <head> or <body> tags — Webflow rejects
     those. The embed renders blank on the Designer canvas; use Preview
     or publish to see it.

     If you later move the files to the repo root, delete "MyGuide-webflow/"
     from the src below. ORIGIN never changes.
     ══════════════════════════════════════════════════════════════════ -->

<div class="myguide-embed" style="width:100%;max-width:1440px;margin:0 auto">
  <iframe
    id="myguide-frame"
    src="https://frederikongenae.github.io/BNPPF-Dashboard/MyGuide-webflow/MyGuide-dashboard.html?embed=1&amp;data=progress.json"
    title="MyGuide production progress dashboard"
    loading="lazy"
    scrolling="no"
    style="width:100%;height:2600px;border:0;display:block;overflow:hidden"></iframe>
</div>

<script>
(function () {
  // Scheme + host only. No repo name, no path, no trailing slash.
  var ORIGIN = "https://frederikongenae.github.io";

  var frame = document.getElementById("myguide-frame");
  if (!frame) return;

  // The dashboard posts its rendered height whenever it changes, so the iframe
  // grows to fit and you never get a scrollbar inside a scrollbar.
  window.addEventListener("message", function (e) {
    if (e.origin !== ORIGIN) return;
    var d = e.data;
    if (d && d.myguide === "height" && typeof d.height === "number" && d.height > 0) {
      frame.style.height = Math.ceil(d.height) + "px";
    }
  });
})();
</script>
