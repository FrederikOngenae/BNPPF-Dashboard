<!-- ══════════════════════════════════════════════════════════════════════
     MyGuide progress dashboard — Webflow Code Embed
     ─────────────────────────────────────────────────────────────────────
     1. Replace BOTH occurrences of https://YOUR-SITE.example.com with the
        origin where you uploaded MyGuide-dashboard.html + progress.json.
        No trailing slash on the ORIGIN constant.
     2. Paste this whole block into a Webflow "Code embed" element.
        Do NOT add <html>, <head> or <body> tags around it — Webflow
        rejects those.
     3. The embed renders blank on the Designer canvas. Use Preview (or
        Publish) to see it.
     ══════════════════════════════════════════════════════════════════ -->

<div class="myguide-embed" style="width:100%;max-width:1440px;margin:0 auto">
  <iframe
    id="myguide-frame"
    src="https://YOUR-SITE.example.com/MyGuide-dashboard.html?embed=1&amp;data=progress.json"
    title="MyGuide production progress dashboard"
    loading="lazy"
    scrolling="no"
    style="width:100%;height:2600px;border:0;display:block;overflow:hidden"></iframe>
</div>

<script>
(function () {
  // Must exactly match the origin of the iframe src above (scheme + host, no path).
  var ORIGIN = "https://YOUR-SITE.example.com";

  var frame = document.getElementById("myguide-frame");
  if (!frame) return;

  // The dashboard posts its rendered height whenever it changes, so the
  // iframe grows to fit and the page never shows a scrollbar inside a scrollbar.
  window.addEventListener("message", function (e) {
    if (e.origin !== ORIGIN) return;
    var d = e.data;
    if (d && d.myguide === "height" && typeof d.height === "number" && d.height > 0) {
      frame.style.height = Math.ceil(d.height) + "px";
    }
  });
})();
</script>
